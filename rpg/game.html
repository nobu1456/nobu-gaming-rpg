<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>レトロ風ドット絵RPG - 三すくみシステム</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(15, 23, 42, 0.95);
            --panel-border: #3b82f6;
            --accent-blue: #38bdf8;
            --accent-red: #f43f5e;
            --accent-gold: #fbbf24;
            --accent-green: #34d399;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, 'Segoe UI';
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 4px;
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            max-width: 960px;
            height: 100%;
            max-height: 100dvh;
            aspect-ratio: 16 / 9;
            background: #020617;
            border: 3px solid #1e293b;
            border-radius: 6px;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.2);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        @media (max-aspect-ratio: 16/9) {
            #game-container {
                width: 100%;
                height: auto;
                aspect-ratio: 16 / 9;
            }
        }

        /* 上部ステージ・ターン表示バー */
        #top-bar {
            height: 40px;
            background: #090d16;
            border-bottom: 2px solid #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 12px;
            font-size: 11px;
            font-weight: bold;
            color: var(--accent-gold);
            z-index: 10;
        }

        /* メインバトルフィールド (background.png対応) */
        #battle-field {
            flex-grow: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            position: relative;
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.5)), url('background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.9);
            overflow: hidden;
        }

        .scenery-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .particle {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            animation: twinkle 3s infinite alternate;
            opacity: 0.3;
        }
        @keyframes twinkle {
            0% { transform: scale(0.8); opacity: 0.2; }
            100% { transform: scale(1.2); opacity: 0.8; }
        }

        .unit-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 5;
            width: 32%;
            max-width: 230px;
        }

        /* ユニットカード (横幅スリム化・HP/MPのみ) */
        .unit-card {
            background: var(--panel-bg);
            border: 2px solid #334155;
            border-radius: 4px;
            padding: 6px 8px;
            display: flex;
            gap: 8px;
            align-items: center;
            cursor: pointer;
            position: relative;
            transition: all 0.15s ease;
            backdrop-filter: blur(4px);
        }

        .unit-card:hover {
            border-color: var(--accent-blue);
        }

        .unit-card.active-turn {
            border-color: var(--accent-gold);
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.5);
            transform: scale(1.02);
        }

        .unit-card.selected-target {
            border-color: var(--accent-red);
            box-shadow: 0 0 12px rgba(244, 63, 94, 0.6);
            animation: pulseTarget 1s infinite alternate;
        }

        @keyframes pulseTarget {
            0% { border-color: var(--accent-red); }
            100% { border-color: #ffffff; }
        }

        .unit-card.dead {
            opacity: 0.25;
            filter: grayscale(1);
            pointer-events: none;
        }

        /* 画像フレーム (1000x1000対応) */
        .portrait-frame {
            width: 42px;
            height: 42px;
            background: #020617;
            border: 2px solid #1e293b;
            border-radius: 3px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .portrait-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 20%;
        }

        .unit-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
        }

        .unit-name-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: bold;
        }

        .role-badge {
            font-size: 8px;
            padding: 1px 4px;
            border-radius: 2px;
            color: #fff;
        }
        .role-sword { background: #e11d48; } /* 剣兵 */
        .role-spear { background: #2563eb; } /* 槍兵 */
        .role-bow { background: #16a34a; }   /* 弓兵 */

        .bar-wrap {
            height: 5px;
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 2px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            transition: width 0.3s ease;
        }
        .hp-bar { background: var(--accent-green); }
        .mp-bar { background: var(--accent-blue); }

        .stat-text {
            font-size: 9px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        /* メッセージログオーバーレイ (ドラクエ風ウィンドウ) */
        #battle-log-overlay {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 480px;
            background: rgba(3, 7, 18, 0.95);
            border: 2px solid var(--accent-gold);
            border-radius: 4px;
            padding: 8px 12px;
            text-align: center;
            font-size: 11px;
            color: var(--accent-gold);
            z-index: 25;
            display: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        /* 下部コマンドウィンドウ (ドラクエ風) */
        #command-panel {
            height: 125px;
            background: #050b14;
            border-top: 3px solid #1e293b;
            display: flex;
            padding: 10px;
            gap: 10px;
            z-index: 20;
            flex-shrink: 0;
        }

        .panel-box {
            background: #090e1a;
            border: 2px solid #2a3a5e;
            border-radius: 4px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* 左側：詳細ステータス・三すくみ相性表示 */
        .status-box {
            width: 220px;
            flex-shrink: 0;
            font-size: 10px;
            gap: 3px;
        }
        .status-box .title {
            color: var(--accent-blue);
            font-weight: bold;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 2px;
            margin-bottom: 2px;
        }

        /* 右側：コマンド選択 */
        .action-box {
            flex-grow: 1;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
        }

        .cmd-btn {
            background: #0f172a;
            border: 2px solid #334155;
            color: var(--text-main);
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            transition: all 0.1s ease;
        }

        .cmd-btn:hover:not(:disabled) {
            background: #1e293b;
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .cmd-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .cmd-btn span.mp {
            font-size: 9px;
            color: var(--accent-blue);
        }

        @media (max-width: 600px) {
            #command-panel {
                flex-direction: column;
                height: auto;
            }
            .status-box {
                width: 100%;
                height: 48px;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                padding: 4px 8px;
            }
            .action-box {
                height: 70px;
            }
        }
    </style>
</head>
<body onload="initGame()">

<div id="game-container">
    <!-- 上部ステータスバー -->
    <div id="top-bar">
        <span id="stage-info">🏰 コモン砦攻城戦 1-1 (三すくみ: 剣>弓>槍>剣)</span>
        <span id="turn-guide" style="color: var(--accent-blue);">司令を選択してください</span>
    </div>

    <!-- バトルフィールド -->
    <div id="battle-field">
        <div class="scenery-layer" id="stars-container"></div>
        <div id="battle-log-overlay"></div>

        <!-- 敵グループ -->
        <div class="unit-group" id="enemy-group"></div>

        <!-- 味方グループ -->
        <div class="unit-group" id="ally-group"></div>
    </div>

    <!-- 下部ドラクエ風コマンドパネル -->
    <div id="command-panel">
        <div class="panel-box status-box" id="left-status-box">
            <div class="title" id="status-ch-name">アリス (剣兵)</div>
            <div id="status-ch-job">兵種: 剣兵 (相性: 弓に強/槍に弱)</div>
            <div id="status-ch-detail">HP・MPのみ表示中。キャラ選択で詳細表示</div>
        </div>

        <div class="panel-box action-box">
            <button class="cmd-btn" id="btn-atk" onclick="selectCommand('attack')">
                <span>⚔️ たたかう</span>
            </button>
            <button class="cmd-btn" id="btn-skill1" onclick="selectCommand('skill1')">
                <span>🔥 ひっさつ</span> <span class="mp">MP 5</span>
            </button>
            <button class="cmd-btn" id="btn-skill2" onclick="selectCommand('skill2')">
                <span>✨ ヒール</span> <span class="mp">MP 6</span>
            </button>
            <button class="cmd-btn" id="btn-def" onclick="selectCommand('defend')">
                <span>🛡️ ぼうぎょ</span>
            </button>
        </div>
    </div>
</div>

<script>
    const SVG_FALLBACK = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"><rect width="64" height="64" fill="#0f172a"/><path d="M24 16h16v8H24z" fill="#94a3b8"/><path d="M20 24h24v20H20z" fill="#475569"/><circle cx="32" cy="18" r="4" fill="#00d2ff"/></svg>`);

    function handleImageError(img) {
        if (!img) return;
        img.onerror = null;
        img.src = SVG_FALLBACK;
    }

    /* 
      三すくみルール:
      - 剣 (sword) は 弓 (bow) に強く、槍 (spear) に弱い
      - 槍 (spear) は 剣 (sword) に強く、弓 (bow) に弱い
      - 弓 (bow) は 槍 (spear) に強く、剣 (sword) に弱い
    */
    function getAdvantageMultiplier(attackerRole, defenderRole) {
        if (attackerRole === 'sword' && defenderRole === 'bow') return { mult: 1.3, text: '【相性有利！】' };
        if (attackerRole === 'sword' && defenderRole === 'spear') return { mult: 0.75, text: '【相性不利…】' };
        
        if (attackerRole === 'spear' && defenderRole === 'sword') return { mult: 1.3, text: '【相性有利！】' };
        if (attackerRole === 'spear' && defenderRole === 'bow') return { mult: 0.75, text: '【相性不利…】' };
        
        if (attackerRole === 'bow' && defenderRole === 'spear') return { mult: 1.3, text: '【相性有利！】' };
        if (attackerRole === 'bow' && defenderRole === 'sword') return { mult: 0.75, text: '【相性不利…】' };

        return { mult: 1.0, text: '' };
    }

    const state = {
        turn: 1,
        phase: 'READY',
        queueIndex: 0,
        activeUnitId: null,
        selectedTargetId: null,
        units: [
            { id: 'a1', name: 'アリス', isAlly: true, role: 'sword', roleName: '剣兵', imgUrl: 'ally1.png', hp: 110, maxHp: 110, mp: 20, maxMp: 20, atk: 28, def: 18, speed: 105, isDefending: false },
            { id: 'a2', name: 'ベリル', isAlly: true, role: 'bow', roleName: '弓兵', imgUrl: 'ally2.png', hp: 75, maxHp: 75, mp: 45, maxMp: 45, atk: 25, def: 10, speed: 120, isDefending: false },
            { id: 'a3', name: 'ソフィア', isAlly: true, role: 'spear', roleName: '槍兵', imgUrl: 'ally3.png', hp: 85, maxHp: 85, mp: 35, maxMp: 35, atk: 26, def: 14, speed: 95, isDefending: false },
            { id: 'e1', name: '槍騎士A', isAlly: false, role: 'spear', roleName: '槍兵', imgUrl: 'enemy1.png', hp: 90, maxHp: 90, mp: 0, maxMp: 0, atk: 24, def: 12, speed: 110, isDefending: false },
            { id: 'e2', name: '剣士長B', isAlly: false, role: 'sword', roleName: '剣兵', imgUrl: 'enemy2.png', hp: 150, maxHp: 150, mp: 0, maxMp: 0, atk: 30, def: 15, speed: 85, isDefending: false }
        ]
    };

    function initGame() {
        initStars();
        startNewTurn();
    }

    function initStars() {
        const c = document.getElementById('stars-container');
        if (!c) return;
        c.innerHTML = '';
        for (let i = 0; i < 15; i++) {
            const s = document.createElement('div');
            s.className = 'particle';
            s.style.left = `${Math.random() * 100}%`;
            s.style.top = `${Math.random() * 100}%`;
            s.style.width = `${Math.random() * 2 + 1}px`;
            s.style.height = s.style.width;
            s.style.animationDuration = `${Math.random() * 2 + 1}s`;
            c.appendChild(s);
        }
    }

    function startNewTurn() {
        state.phase = 'READY';
        const aliveUnits = state.units.filter(u => u.hp > 0);
        
        state.actionQueue = aliveUnits.sort((a, b) => {
            const spA = a.speed + Math.floor(Math.random() * 15);
            const spB = b.speed + Math.floor(Math.random() * 15);
            return spB - spA;
        }).map(u => u.id);

        state.queueIndex = 0;
        processNextInQueue();
    }

    function processNextInQueue() {
        if (checkWinLose()) return;

        if (state.queueIndex >= state.actionQueue.length) {
            state.turn++;
            state.units.forEach(u => u.isDefending = false);
            startNewTurn();
            return;
        }

        const currentId = state.actionQueue[state.queueIndex];
        const unit = state.units.find(u => u.id === currentId);

        if (!unit || unit.hp <= 0) {
            state.queueIndex++;
            processNextInQueue();
            return;
        }

        state.activeUnitId = unit.id;

        if (unit.isAlly) {
            state.phase = 'SELECTING';
            const firstEnemy = state.units.find(u => !u.isAlly && u.hp > 0);
            state.selectedTargetId = firstEnemy ? firstEnemy.id : null;
            
            updateLeftStatus(unit);
            render();
            document.getElementById('turn-guide').innerText = `${unit.name} のこうどう！`;
        } else {
            state.phase = 'EXECUTING';
            render();
            setTimeout(() => {
                executeEnemyAction(unit);
            }, 800);
        }
    }

    function inspectUnit(unitId) {
        const u = state.units.find(item => item.id === unitId);
        if (!u) return;

        updateLeftStatus(u);

        if (state.phase === 'SELECTING') {
            if (!u.isAlly && u.hp > 0) {
                state.selectedTargetId = u.id;
                render();
            } else if (u.isAlly && u.hp > 0) {
                state.activeUnitId = u.id;
                updateLeftStatus(u);
                render();
            }
        }
    }

    function updateLeftStatus(u) {
        document.getElementById('status-ch-name').innerText = `${u.name} (${u.roleName})`;
        document.getElementById('status-ch-job').innerText = `攻:${u.atk} / 防:${u.def} / 速:${u.speed}`;
        document.getElementById('status-ch-detail').innerText = `HP:${u.hp}/${u.maxHp} | MP:${u.mp}/${u.maxMp} ${u.isDefending ? '[防御中]' : ''}`;
    }

    function selectCommand(type) {
        if (state.phase !== 'SELECTING') return;
        const activeAlly = state.units.find(u => u.id === state.activeUnitId);
        if (!activeAlly) return;

        let target = state.units.find(u => u.id === state.selectedTargetId);
        if (!target || target.hp <= 0) {
            target = state.units.find(u => !u.isAlly && u.hp > 0);
        }

        if (type === 'skill1' && activeAlly.mp < 5) {
            showLog("MPが足りない！");
            return;
        }
        if (type === 'skill2' && activeAlly.mp < 6) {
            showLog("MPが足りない！");
            return;
        }

        state.phase = 'EXECUTING';
        executeAllyAction(activeAlly, type, target);
    }

    async function executeAllyAction(actor, action, target) {
        const overlay = document.getElementById('battle-log-overlay');
        overlay.style.display = 'block';

        const adv = target ? getAdvantageMultiplier(actor.role, target.role) : { mult: 1.0, text: '' };

        if (action === 'attack') {
            let baseDmg = Math.max(5, actor.atk - Math.floor(target.def / 2) + Math.floor(Math.random() * 6) - 3);
            let dmg = Math.floor(baseDmg * adv.mult);
            target.hp = Math.max(0, target.hp - dmg);
            overlay.innerText = `${actor.name} のこうげき！ ${adv.text}\n${target.name} に ${dmg} のダメージ！`;
        } else if (action === 'skill1') {
            actor.mp -= 5;
            let baseDmg = Math.max(15, (actor.atk * 1.8) - target.def + Math.floor(Math.random() * 8));
            let dmg = Math.floor(baseDmg * adv.mult);
            target.hp = Math.max(0, target.hp - dmg);
            overlay.innerText = `${actor.name} のひっさつぎ！ ${adv.text}\n${target.name} に ${dmg} の大ダメージ！`;
        } else if (action === 'skill2') {
            actor.mp -= 6;
            const lowestAlly = [...state.units].filter(u => u.isAlly && u.hp > 0).sort((a,b) => (a.hp/a.maxHp) - (b.hp/b.maxHp))[0];
            const heal = 35 + Math.floor(Math.random() * 10);
            lowestAlly.hp = Math.min(lowestAlly.maxHp, lowestAlly.hp + heal);
            overlay.innerText = `${actor.name} は ヒールを唱えた！\n${lowestAlly.name} のHPが ${heal} 回復した！`;
        } else if (action === 'defend') {
            actor.isDefending = true;
            overlay.innerText = `${actor.name} は みをまもっている。`;
        }

        render();
        await new Promise(r => setTimeout(r, 1200));
        overlay.style.display = 'none';

        nextTurnStep();
    }

    async function executeEnemyAction(enemy) {
        const overlay = document.getElementById('battle-log-overlay');
        overlay.style.display = 'block';

        const aliveAllies = state.units.filter(u => u.isAlly && u.hp > 0);
        if (aliveAllies.length === 0) return;
        const target = aliveAllies[Math.floor(Math.random() * aliveAllies.length)];

        const adv = getAdvantageMultiplier(enemy.role, target.role);
        let baseDmg = Math.max(3, enemy.atk - Math.floor(target.def / 2) + Math.floor(Math.random() * 5));
        let dmg = Math.floor(baseDmg * adv.mult);

        if (target.isDefending) {
            dmg = Math.floor(dmg / 2);
        }
        target.hp = Math.max(0, target.hp - dmg);

        overlay.innerText = `${enemy.name} のこうげき！ ${adv.text}\n${target.name} に ${dmg} のダメージ！`;

        render();
        await new Promise(r => setTimeout(r, 1200));
        overlay.style.display = 'none';

        nextTurnStep();
    }

    function nextTurnStep() {
        if (checkWinLose()) return;
        state.queueIndex++;
        processNextInQueue();
    }

    function checkWinLose() {
        const aliveEnemies = state.units.filter(u => !u.isAlly && u.hp > 0);
        const aliveAllies = state.units.filter(u => u.isAlly && u.hp > 0);

        if (aliveEnemies.length === 0) {
            state.phase = 'GAME_OVER';
            const overlay = document.getElementById('battle-log-overlay');
            overlay.style.display = 'block';
            overlay.innerText = "🏆 まものたちを全滅させた！\n【ステージクリア】";
            setTimeout(() => location.reload(), 3000);
            return true;
        }
        if (aliveAllies.length === 0) {
            state.phase = 'GAME_OVER';
            const overlay = document.getElementById('battle-log-overlay');
            overlay.style.display = 'block';
            overlay.innerText = "💀 パーティは全滅してしまった……\n【ぜんめつ】";
            setTimeout(() => location.reload(), 3000);
            return true;
        }
        return false;
    }

    function showLog(msg) {
        const overlay = document.getElementById('battle-log-overlay');
        overlay.style.display = 'block';
        overlay.innerText = msg;
        setTimeout(() => overlay.style.display = 'none', 1200);
    }

    function render() {
        renderUnits();
        renderCommandPanel();
    }

    function renderUnits() {
        const allyGrp = document.getElementById('ally-group');
        const enemyGrp = document.getElementById('enemy-group');
        allyGrp.innerHTML = '';
        enemyGrp.innerHTML = '';

        state.units.forEach(u => {
            const card = document.createElement('div');
            card.className = `unit-card ${u.hp <= 0 ? 'dead' : ''}`;
            
            if (u.id === state.activeUnitId && state.phase === 'SELECTING') {
                card.classList.add('active-turn');
            }
            if (!u.isAlly && u.id === state.selectedTargetId && state.phase === 'SELECTING') {
                card.classList.add('selected-target');
            }

            card.onclick = () => inspectUnit(u.id);

            const hpPct = (u.hp / u.maxHp) * 100;
            const mpPct = u.maxMp > 0 ? (u.mp / u.maxMp) * 100 : 0;

            let roleClass = 'role-sword';
            if (u.role === 'spear') roleClass = 'role-spear';
            if (u.role === 'bow') roleClass = 'role-bow';

            const mpBarHtml = u.maxMp > 0 ? `
                <div class="stat-text"><span>MP</span><span>${u.mp}/${u.maxMp}</span></div>
                <div class="bar-wrap"><div class="bar-fill mp-bar" style="width:${mpPct}%"></div></div>
            ` : '';

            card.innerHTML = `
                <div class="portrait-frame">
                    <img src="${u.imgUrl || ''}" class="portrait-img" alt="${u.name}" onerror="handleImageError(this)">
                </div>
                <div class="unit-info">
                    <div class="unit-name-row">
                        <span>${u.name}</span>
                        <span class="role-badge ${roleClass}">${u.roleName}</span>
                    </div>
                    <div class="stat-text"><span>HP</span><span>${u.hp}/${u.maxHp}</span></div>
                    <div class="bar-wrap"><div class="bar-fill hp-bar" style="width:${hpPct}%"></div></div>
                    ${mpBarHtml}
                </div>
            `;

            if (u.isAlly) {
                allyGrp.appendChild(card);
            } else {
                enemyGrp.appendChild(card);
            }
        });
    }

    function renderCommandPanel() {
        const activeAlly = state.units.find(u => u.id === state.activeUnitId);
        const isSelectable = (state.phase === 'SELECTING' && activeAlly && activeAlly.isAlly);

        document.getElementById('btn-atk').disabled = !isSelectable;
        document.getElementById('btn-skill1').disabled = !isSelectable || (activeAlly && activeAlly.mp < 5);
        document.getElementById('btn-skill2').disabled = !isSelectable || (activeAlly && activeAlly.mp < 6);
        document.getElementById('btn-def').disabled = !isSelectable;
    }
</script>
</body>
</html>
